name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./client/package-lock.json

      - name: Install client deps
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Build client
        working-directory: ./client
        run: npm run build

  test-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./admin/package-lock.json

      - name: Install admin deps
        working-directory: ./admin
        run: npm ci

      - name: Run ESLint
        working-directory: ./admin
        run: npm run lint

      - name: Build admin
        working-directory: ./admin
        run: npm run build

create_issue:
  runs-on: ubuntu-latest
  needs: [test-client, test-admin]
  if: failure()
  permissions:
    issues: write

  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const branch = context.ref.replace('refs/heads/', '');

          const title = `FAILURE: CI/CD Pipeline Failed on branch ${branch}`;
          const body = `
          **CI/CD Pipeline Failed**

          **Branch:** \`${branch}\`
          **Commit:** \`${context.sha}\`

          **Client Test:** \`${{ needs['test-client'].result }}\`
          **Admin Test:** \`${{ needs['test-admin'].result }}\`

          **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

          *Created automatically by GitHub Actions.*
          `;

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body,
            labels: ['bug', 'ci/cd-failure'],
            assignees: [context.actor]
          });

close_issue:
  runs-on: ubuntu-latest
  needs: [test-client, test-admin]
  if: needs.test-client.result == 'success' && needs.test-admin.result == 'success'
  permissions:
    issues: write

  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const branch = context.ref.replace('refs/heads/', '');
          const title = `FAILURE: CI/CD Pipeline Failed on branch ${branch}`;

          const results = await github.rest.search.issuesAndPullRequests({
            q: `is:open repo:${context.repo.owner}/${context.repo.repo} in:title "${title}" label:ci/cd-failure`,
          });

          for (const issue of results.data.items) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `All CI tests have passed. Closing this CI/CD failure issue.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });
          }
